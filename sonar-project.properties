# Analyze the SDK only. The other modules are sample consumers of the SDK.
sonar.sources=mapp-engage-sdk/src/main/java
sonar.tests=mapp-engage-sdk/src/test/java,mapp-engage-sdk/src/androidTest/java
sonar.sourceEncoding=UTF-8

# Generate the report with:
# ./gradlew -PuseLocalEngage=true :mapp-engage-sdk:jacocoProdDebugUnitTestReport
# To include connected-device tests, run connectedProdDebugAndroidTest before the report task.
sonar.coverage.jacoco.xmlReportPaths=mapp-engage-sdk/build/reports/jacoco/jacocoProdDebugUnitTestReport/jacocoProdDebugUnitTestReport.xml
sonar.java.binaries=mapp-engage-sdk/build/intermediates/built_in_kotlinc/prodDebug/compileProdDebugKotlin/classes,mapp-engage-sdk/build/intermediates/javac/prodDebug/compileProdDebugJavaWithJavac/classes

# Exclude only logic-free declarations and thin platform adapters from coverage.
# They remain in static analysis.
# Keep this list aligned with the JaCoCo fileFilter in mapp-engage-sdk/build.gradle.kts.
sonar.coverage.exclusions=\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/migration/data/OldRegistration.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/model/request/geo/GeoEvent.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/model/response/inapp/Message.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/provider/SystemInfoProviderImpl.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/stats/StatsClient.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/ui/inapp/InAppManager.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/internal/ui/push/model/SilentType.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/shared/ActionButton.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/shared/InboxMessagesResponse.kt,\
  mapp-engage-sdk/src/main/java/com/appoxee/shared/NotificationMode.kt
