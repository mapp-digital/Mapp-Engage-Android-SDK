[versions]
glide = "5.0.7"
kotlin = "2.3.20"
core-ktx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"
lifecycle-runtime-ktx = "2.10.0"
coroutines-ktx = "1.11.0"
activity-ktx = "1.13.0"
fragment-ktx = "1.8.9"
lifecycle-viewmodel-ktx = "2.10.0"
browser = "1.10.0"
recycler = "1.4.0"
constraint-layout = "2.2.1"
firebase-bom = "34.14.1"
datastore-preferences = "1.2.1"
coil = "2.7.0"
media3 = "1.10.1"
work-manager = "2.11.2"
play-services-location = "21.3.0"
junit = "4.13.2"
junit-jupiter = "6.1.0"
mockk = "1.14.11"
truth = "1.4.5"
json = "20260522"
mock-webserver = "5.4.0"
kotlinx-coroutines-test = "1.11.0"
androidx-test-junit = "1.3.0"
androidx-test-espresso = "3.7.0"
androidx-test-core = "1.7.0"
androidx-test-mockk = "1.14.11"
lifecycle-process = "2.10.0"
mapp-engage="7.0.3"

[libraries]
## BASE
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
coroutines-ktx = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines-ktx" }
viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle-viewmodel-ktx" }
engage-android = {group="com.mapp.sdk", name="engage-android", version.ref="mapp-engage"}


## Chrome Tabs - browser
browser = { module = "androidx.browser:browser", version.ref = "browser" }

## UI components
recycler = { module = "androidx.recyclerview:recyclerview", version.ref = "recycler" }
constraint-layout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint-layout" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging-ktx = { module = "com.google.firebase:firebase-messaging" }

## Datastore Prefs
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }

## Coil
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }

## Exoplayer media 3
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

## Worker
work-manager = { module = "androidx.work:work-runtime-ktx", version.ref = "work-manager" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }

## Test
junit4 = { module = "junit:junit", version.ref = "junit" }
jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
json = { module = "org.json:json", version.ref = "json" }
okhttp3-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mock-webserver" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }


## Android Test
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-mockk = { module = "io.mockk:mockk-android", version.ref = "androidx-test-mockk" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle-process" }

[bundles]
base = ["appcompat", "material","core-ktx", "lifecycle-runtime-ktx", "coroutines-ktx", "androidx-activity-ktx", "androidx-fragment-ktx"]
ui-components = ["recycler", "constraint-layout"]
coil = ["coil", "coil-gif"]
media3 = ["media3-exoplayer", "media3-exoplayer-dash", "media3-ui"]
test = ["junit4", "jupiter", "mockk", "truth", "json", "kotlinx-coroutines-test", "okhttp3-mockwebserver"]
android-test = ["androidx-test-junit", "androidx-test-mockk", "androidx-test-core", "androidx-test-espresso", "truth", "jupiter", "kotlinx-coroutines-test"]
