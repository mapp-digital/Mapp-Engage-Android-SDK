name: Upload to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Debug directory
        run: |
          ls -R .

      - name: Create local.properties
        run: |
          echo "mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}" >> local.properties
          echo "mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}" >> local.properties
          echo "signing.keyId=${{ secrets.SIGNING_KEY_ID }}" >> local.properties
          echo "signing.password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties
          echo "signing.keyBase64=${{ secrets.SIGNING_KEY_ASC }}" >> local.properties

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Publish to Maven Central
        run: |
          ./gradlew \
          :mapp-engage-sdk:clean \
          :mapp-engage-sdk:checkApiCompatibility \
          :mapp-engage-sdk:testProdDebugUnitTest \
          :mapp-engage-sdk:assembleProdRelease \
          :mapp-engage-sdk:publishMavenPublicationToMavenLocal \
          :mapp-engage-sdk:uploadToCentralPortal \
          -x test \
          -x check \
          --stacktrace --no-daemon

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "^VERSION_NAME=" mapp-engage-sdk/gradle.properties | cut -d'=' -f2)
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing tag and release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Mapp Engage ${{ steps.version.outputs.name }}
          generate_release_notes: true
