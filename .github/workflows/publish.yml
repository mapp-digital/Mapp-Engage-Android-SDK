name: Publish to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug directory
        run: |
          ls -R .

      - name: Prepare signing key
        run: |
          mkdir -p mapp-engage-sdk
          # If your SIGNING_KEY_ASC secret is base64-encoded, the first branch will decode it.
          # If it's the literal ASCII-armored key (-----BEGIN PGP PRIVATE KEY BLOCK-----...), the second branch will write it directly.
          set -e
          if echo "${{ secrets.SIGNING_KEY_ASC }}" | base64 --decode >/dev/null 2>&1; then
            echo "${{ secrets.SIGNING_KEY_ASC }}" | base64 --decode > mapp-engage-sdk/3F5AB862.asc
          else
            printf '%s\n' "${{ secrets.SIGNING_KEY_ASC }}" > mapp-engage-sdk/3F5AB862.asc
          fi
          chmod 600 mapp-engage-sdk/3F5AB862.asc

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          centralUsername=${{ secrets.CENTRAL_USERNAME }}
          centralPassword=${{ secrets.CENTRAL_PASSWORD }}
          signing.keyId=${{ secrets.SIGNING_KEY_ID }}
          signing.password=${{ secrets.SIGNING_KEY_PASSWORD }}
          signing.secretKeyRingFile=mapp-engage-sdk/3F5AB862.asc
          EOF
          chmod 600 local.properties

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Publish to Maven Central
        run: |
          ./gradlew uploadToCentralPortal --no-daemon --stacktrace
          # cleanup key material (try shred, fallback to rm)
          if command -v shred >/dev/null 2>&1; then
            shred -u mapp-engage-sdk/3F5AB862.asc || true
          else
            rm -f mapp-engage-sdk/3F5AB862.asc || true
          fi
