name: CodeQL

# Use advanced CodeQL setup in the repository settings for this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compile SDK production sources without building/signing the sample apps.
      # Disable cached compilation so CodeQL can observe Java and Kotlin work.
      - name: Build native SDK for analysis
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew :mapp-engage-sdk:assembleProdDebug
          -PuseLocalEngage=true
          -Pkotlin.compiler.execution.strategy=in-process
          --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          --console=plain --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
