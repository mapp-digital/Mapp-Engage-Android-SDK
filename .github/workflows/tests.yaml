name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run unit tests
        run: ./gradlew :mapp-engage-sdk:clean :mapp-engage-sdk:checkApiCompatibility :mapp-engage-sdk:testProdDebugUnitTest --no-daemon --stacktrace

      # Published SDK artifacts are release builds, even in debuggable client apps.
      - name: Check logging with the release SDK variant
        # AGP 9 otherwise creates unit test tasks only for the tested build type (debug).
        run: >-
          ./gradlew :mapp-engage-sdk:testProdReleaseUnitTest
          --tests com.appoxee.internal.util.LoggerTest
          -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false
          --no-daemon --stacktrace
